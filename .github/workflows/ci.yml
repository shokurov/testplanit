name: CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**', 'release/**', 'users/**' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: [self-hosted]
    # Skip CI on release commits from semantic-release
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    env:
      # env.js (t3-env) validates DATABASE_URL at import time with
      # emptyStringAsUndefined: true, so an unset or empty secret crashes
      # any test that transitively imports the prisma client (3 review
      # specs currently). The placeholder satisfies Zod; unit tests mock
      # prisma anyway, and integration tests that need a real DB get the
      # real secret when it's configured.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://testplanit.test' }}
      NODE_OPTIONS: "--max-old-space-size=12288"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        # --frozen-lockfile is the pre-merge lockfile-integrity gate: it fails
        # fast if the root pnpm-lock.yaml has drifted from the manifests (e.g. a
        # Dependabot bump that didn't regenerate it), matching the frozen install
        # the release Docker build relies on. A non-frozen install would silently
        # rewrite the lockfile in-runner and pass, deferring the failure to release.
        run: |
          cd testplanit
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate ZenStack and Prisma
        run: |
          cd testplanit
          pnpm zenstack generate
          pnpm prisma generate

      - name: Check formatting
        run: |
          cd testplanit
          pnpm format:check

      - name: Run linter
        run: |
          cd testplanit
          pnpm lint

      - name: Run unit tests
        run: |
          cd testplanit
          pnpm test run

      # packages/api and cli are pnpm workspace members — they were already
      # installed by the workspace-aware install above. No second install
      # step needed.
      - name: Run packages unit tests
        run: pnpm test run
        working-directory: packages/api

      - name: Run CLI unit tests
        run: pnpm test
        working-directory: cli

      # jira-panel-ui and jira-dc-frontend are root pnpm workspace members
      # (see /pnpm-workspace.yaml), already installed by the workspace-aware
      # install above — run from the repo root via --filter, not `cd testplanit`.
      - name: Run jira-panel-ui unit tests
        run: pnpm --filter @testplanit/jira-panel-ui test

      - name: Run jira-dc-frontend unit tests
        run: pnpm --filter @testplanit/jira-dc-frontend test

  # Builds the Jira Data Center plugin JAR: webpack frontend bundles, then
  # `mvn package` (which also runs the Java unit tests).
  #
  # NOTE: runs on a GitHub-hosted runner for JDK 21 + Maven. If this org only
  # permits self-hosted runners, change runs-on to a self-hosted label that
  # has JDK 21 and Maven available.
  jira-dc-plugin:
    name: Jira DC plugin
    runs-on: ubuntu-latest
    # Skip CI on release commits from semantic-release
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Build tooling requires JDK 21: atlassian-spring-scanner-maven-plugin
      # 6.0.2 is compiled for Java 21 and fails under a JDK-17 Maven. The
      # plugin's emitted bytecode still targets Java 17 (see jira-dc-plugin/pom.xml),
      # which is what the Jira 10.3 runtime actually loads.
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        # Workspace-wide install from the repo root (not `cd testplanit`) —
        # this job needs @testplanit/jira-dc-frontend and
        # @testplanit/jira-panel-ui, which are root workspace members.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build frontend bundles and package the plugin JAR
        run: pnpm run build:jira-dc